name: verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publicacion-y-figuras:
    name: Integridad y reconstrucción de figuras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependencias R
        run: Rscript -e 'install.packages(c("jsonlite", "digest", "ggplot2"))'
      - name: Verificar publicación (payloads, tablas, SHA-256)
        run: Rscript tests/verificar_publicacion.R
      - name: Reconstruir las diez figuras desde los agregados
        run: Rscript src/figures/render_figures.R --data results/aggregate --output figuras_reconstruidas
      - name: Comprobar que las diez figuras se generaron
        run: |
          n=$(ls figuras_reconstruidas/png/*.png | wc -l)
          test "$n" -eq 10

  gpu-runtime:
    name: Runtime GPU genérico (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias Python
        run: pip install numpy pytest
      - name: Tests (los que requieren GPU se omiten de forma explícita)
        run: python -m pytest src/gpu-runtime -q
